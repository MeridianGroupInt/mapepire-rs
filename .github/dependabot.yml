version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci(deps)
      include: scope
    groups:
      actions:
        update-types: ["major", "minor", "patch"]
    ignore:
      # The msrv job pins dtolnay/rust-toolchain to an exact MSRV toolchain.
      # Bumping the ref rewrites the MSRV floor and makes the job meaningless.
      - dependency-name: "dtolnay/rust-toolchain"
      # Every action here is pinned to a floating major on purpose. `@v2`
      # already resolves past any patch Dependabot proposes, so a patch pin is
      # a no-op that only freezes us behind the tag we pinned.
      - dependency-name: "taiki-e/install-action"
