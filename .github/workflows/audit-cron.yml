name: Audit (scheduled)

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock for audit
        run: cargo generate-lockfile
      # TODO(PRO-395): bump when Node-24 release available — currently on Node 20 (deprecated 2026-09-16)
      # No `ignore:` list, matching ci.yml's audit job. RUSTSEC-2026-0009
      # (time 0.3.45) was ignored only because the patched time 0.3.47
      # requires Rust 1.88; the 0.5.0 MSRV bump lets it resolve normally,
      # so the daily cron no longer needs the suppression (gh #51).
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
