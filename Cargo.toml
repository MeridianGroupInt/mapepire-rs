[package]
name = "mapepire"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Async Rust client for Mapepire — Db2 for IBM i over secure WebSockets"
repository = "https://github.com/MeridianGroupInt/mapepire-rs"
documentation = "https://docs.rs/mapepire"
readme = "README.md"
keywords = ["ibm-i", "db2", "mapepire", "database", "websocket"]
categories = ["database", "asynchronous"]

# Whitelist what ships in the published package. Cargo always includes
# Cargo.toml, Cargo.lock, .cargo_vcs_info.json, and Cargo.toml.orig
# regardless of this list. Everything else (tests/, .github/, contributor
# docs, dev tooling, snap fixtures, etc.) stays in the repo for
# contributors and gets dropped from the crates.io tarball.
include = [
    "src/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
default = ["rustls-tls"]
rustls-tls = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "tokio-tungstenite/rustls-tls-webpki-roots",
]
native-tls = [
    "dep:native-tls",
    "dep:tokio-native-tls",
    "tokio-tungstenite/native-tls",
]
insecure-tls = []
serde-config = []
tracing = ["dep:tracing"]
metrics = ["dep:metrics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
# Required: HTTP Basic on the WebSocket upgrade (`src/transport/handshake.rs`)
# and, under `serde-config`, decoding pinned-CA DER in `TlsConfigSpec`.
base64 = "0.23.1"
tokio = { version = "1.23.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures = "0.3"
pin-project-lite = "0.2"
async-trait = "0.1"
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
bytes = "1.11.1"
tracing = { version = "0.1", optional = true }
metrics = { version = "0.24", optional = true }
# Optional TLS stacks — pulled by their respective feature flags above.
rustls = { version = "0.23.43", optional = true, default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false }
rustls-pki-types = { version = "1.15.1", optional = true }
webpki-roots = { version = "1.0.9", optional = true }
native-tls = { version = "0.2", optional = true }
tokio-native-tls = { version = "0.3", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"
pretty_assertions = "1"
tokio = { version = "1.23.1", features = ["full", "test-util"] }
tokio-test = "0.4"
# Test-only `tracing-subscriber` so the Task 10 / PRO-588 integration test
# can install a custom `Layer` that captures span open + `record(...)`
# updates as well as events. `tracing-test` was evaluated first but
# relies on the default `FmtSubscriber`, which only emits events to its
# buffer — `tracing::instrument` (Tasks 7/8) opens a span without
# emitting an event, and `Span::current().record("tier", ...)` (Task 7's
# routing-tier marker) likewise doesn't emit, so a `FmtSubscriber`-backed
# tester would observe an empty buffer for the `Pool::execute` path. The
# custom-Layer route is the same shape the `tracing` book recommends for
# verifying span instrumentation.
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std", "registry", "fmt", "env-filter"] }
# Mock TLS+WebSocket server harness (Task 21 / PRO-417).
# rcgen mints self-signed certs at test time; tokio-rustls drives the
# server-side TLS acceptor. Both are dev-only — they never ship in the
# published crate. tokio-rustls version is pinned to match the regular dep
# exactly so cargo-deny's multiple-versions = "deny" stays clean.
# `default-features = false` drops rcgen's `pem` feature, which is unused
# here (the harness only needs DER: `cert.der()` + `signing_key.serialize_der()`)
# and which pulls `pem -> base64 0.22`, colliding with our own `base64 0.23`
# under cargo-deny's `multiple-versions = "deny"`.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26.4", default-features = false }
# Enable rustls' ring provider so the process-level CryptoProvider is
# populated when running tests. rcgen pulls ring into the dep tree, but
# rustls only auto-selects a provider when exactly one of its own
# `ring`/`aws_lc_rs` features is active. This dev-dep activates `ring`
# on the same rustls version, resolving the ambiguity at test time only.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
# `metrics-util`'s `debugging` feature exposes `DebuggingRecorder` +
# `Snapshotter` for the Task 13 metrics integration test
# (`tests/metrics_smoke.rs`). `default-features = false` keeps the
# dev-dep tree minimal — we only need the `debugging` shim. Version
# 0.20 is API-aligned with the `metrics 0.24` dep so cargo-deny's
# multiple-versions = "deny" stays clean.
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }

# Examples shipping under examples/ — declared explicitly when they
# depend on a non-default Cargo feature so `cargo build --examples`
# without that feature skips them rather than failing to resolve symbols.
[[example]]
name = "with_tracing"
required-features = ["tracing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
